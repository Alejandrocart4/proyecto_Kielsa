<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kielsa Hamiltoniano</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="layout"><header><p>Matemática Discreta · Entrega 2</p><h1>Constructor de circuitos hamiltonianos</h1><span>Algoritmo y servidor en Python · mapa y rutas en Google Maps</span></header>
<section class="panel controls"><label>Bloque <select id="block"></select></label><label>Nodo inicial <select id="start"></select></label><button id="analyze">Buscar circuito</button><button id="reset">Restaurar Avance 1</button></section>
<section class="two"><article class="panel"><h2>Nodos</h2><form id="node-form"><input id="node-name" placeholder="Nombre de farmacia" required><input id="node-lat" type="number" step="any" placeholder="Latitud"><input id="node-lng" type="number" step="any" placeholder="Longitud"><button>Agregar</button></form><ul id="nodes"></ul></article><article class="panel"><h2>Aristas y pesos</h2><form id="edge-form"><select id="from"></select><select id="to"></select><input id="weight" type="number" step="0.01" min="0.01" placeholder="km" required><button>Agregar</button></form><div id="edges"></div></article></section>
<section class="panel"><h2>Resultado Python</h2><div id="result"></div><button id="roads">Dibujar caminos reales</button><p id="status"></p></section><section class="panel"><h2>Mapa de San Pedro Sula</h2><div id="map"></div></section></main>
<script>window.MAPS_KEY={{ maps_key|tojson }};</script><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
